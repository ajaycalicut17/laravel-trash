name: run-tests

permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true

      matrix:
        stability: [prefer-stable]

        include:
          - laravel: 10.*
            php: 8.2
            testbench: 8.*

          - laravel: 11.*
            php: 8.2
            testbench: 9.*

          - laravel: 12.*
            php: 8.3
            testbench: 10.*

          - laravel: 13.*
            php: 8.3
            testbench: 11.*

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, sqlite, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: |
          composer require \
            "laravel/framework:${{ matrix.laravel }}" \
            "orchestra/testbench:${{ matrix.testbench }}" \
            --dev \
            --no-interaction \
            --no-update

          composer update \
            --${{ matrix.stability }} \
            --prefer-dist \
            --no-interaction

      - name: Execute tests
        run: composer test
